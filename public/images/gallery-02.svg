<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" width="1000" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0.15" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#262019"/>
      <stop offset="1" stop-color="#080605"/>
    </linearGradient>
    <radialGradient id="key" cx="0.3" cy="0.18" r="0.85">
      <stop offset="0" stop-color="#e8a34a" stop-opacity="0.450"/>
      <stop offset="0.38" stop-color="#b4622c" stop-opacity="0.195"/>
      <stop offset="1" stop-color="#b4622c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rim" cx="0.9" cy="0.9" r="0.7">
      <stop offset="0" stop-color="#b4622c" stop-opacity="0.210"/>
      <stop offset="1" stop-color="#b4622c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.78">
      <stop offset="0.5" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="1000" height="900" fill="url(#base)"/>
  <rect width="1000" height="900" fill="url(#key)"/>
  <rect width="1000" height="900" fill="url(#rim)"/>
  <g transform="scale(10 9)" fill="none" stroke="#f2eada" stroke-width="1" opacity="0.05" vector-effect="non-scaling-stroke"><rect x="18" y="14" width="64" height="72"/></g>
  <rect width="1000" height="900" filter="url(#grain)" opacity="0.14" style="mix-blend-mode:overlay"/>
  <rect width="1000" height="900" fill="url(#vignette)"/>
</svg>
