<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0.15" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#2b2119"/>
      <stop offset="1" stop-color="#080605"/>
    </linearGradient>
    <radialGradient id="key" cx="0.78" cy="0.16" r="0.85">
      <stop offset="0" stop-color="#e8a34a" stop-opacity="0.510"/>
      <stop offset="0.38" stop-color="#b4622c" stop-opacity="0.221"/>
      <stop offset="1" stop-color="#b4622c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rim" cx="0.14" cy="0.94" r="0.7">
      <stop offset="0" stop-color="#b4622c" stop-opacity="0.238"/>
      <stop offset="1" stop-color="#b4622c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.78">
      <stop offset="0.5" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.6"/>
