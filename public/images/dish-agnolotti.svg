  <rect width="1000" height="1250" fill="url(#base)"/>
  <rect width="1000" height="1250" fill="url(#key)"/>
  <rect width="1000" height="1250" fill="url(#rim)"/>
  <g transform="scale(10 12.5) translate(6 12) scale(1.24)" fill="none" stroke="#f2eada" stroke-width="1" opacity="0.045" vector-effect="non-scaling-stroke"><circle cx="50" cy="52" r="30"/><circle cx="50" cy="52" r="21"/></g>
  <rect width="1000" height="1250" filter="url(#grain)" opacity="0.14" style="mix-blend-mode:overlay"/>
  <rect width="1000" height="1250" fill="url(#vignette)"/>
